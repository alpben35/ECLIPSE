<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Standard high-compatibility Gaussian Blur filter for the corona glow -->
    <filter id="corona-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36" />
    </filter>
  </defs>

  <style>
    :root {
      --bg-color: transparent;
      --base-circle-color: #000000;
      --eclipse-circle-color: #ffffff;
      --glow-color: rgba(59, 130, 246, 0.45);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --base-circle-color: #ffffff;
        --eclipse-circle-color: #030712;
        --glow-color: rgba(255, 255, 255, 0.35);
      }
    }
    .base-circle {
      fill: var(--base-circle-color);
      transition: fill 0.3s ease;
    }
    .eclipse-circle {
      fill: var(--eclipse-circle-color);
      transition: fill 0.3s ease;
    }
    .glow-effect {
      fill: var(--glow-color);
      transition: fill 0.3s ease;
    }
  </style>

  <!-- Ambient Corona / Glow Effect equivalent to Logo.tsx -->
  <circle cx="256" cy="256" r="160" class="glow-effect" filter="url(#corona-blur)" />

  <!-- The Base Circle -->
  <circle cx="256" cy="256" r="210" class="base-circle" />

  <!-- The Eclipse Circle, offset by 9% horizontally and scaled to 95% -->
  <!-- 256 + (210 * 0.09) = 256 + 18.9 = 274.9 -->
  <!-- R = 210 * 0.95 = 199.5 -->
  <circle cx="274.9" cy="256" r="199.5" class="eclipse-circle" />
</svg>
